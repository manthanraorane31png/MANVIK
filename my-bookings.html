<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings | MANVIK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold brand-logo"
           href="index.html">

            MAN<span class="orange">VIK</span>

        </a>


        <div class="ms-auto">

            <a href="index.html"
               class="btn btn-outline-dark">

                ← Home

            </a>

        </div>

    </div>

</nav>



<!-- ================= MY BOOKINGS ================= -->

<section class="section-padding">

    <div class="container">


        <div class="text-center mb-5">

            <span class="badge bg-light text-dark border px-3 py-2">

                MY BOOKINGS

            </span>


            <h1 class="mt-3">

                My Bookings

            </h1>


            <p class="text-muted">

               View your upcoming and confirmed home service bookings in one place.

            </p>

        </div>



        <!-- BOOKING CARD -->

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div id="bookingContainer">


                    <!-- Booking will appear here -->

                </div>

            </div>

        </div>


    </div>

</section>



<!-- ================= JAVASCRIPT ================= -->

<script>


const savedBooking =
    localStorage.getItem("manvikBooking");


const container =
    document.getElementById("bookingContainer");



if (savedBooking) {


    const booking =
        JSON.parse(savedBooking);


    container.innerHTML = `

        <div class="card border-0 shadow-sm p-4">

            <div class="d-flex justify-content-between
                        align-items-center flex-wrap mb-4">

                <div>

                    <span class="badge bg-success">

                        Confirmed

                    </span>

                    <h3 class="mt-2 mb-0">

                        ${booking.service || "Home Service"}

                    </h3>

                </div>


                <div class="text-md-end mt-3 mt-md-0">

                    <small class="text-muted">

                        Booking ID

                    </small>

                    <h5 class="mb-0">

                        ${booking.bookingId || "MV-000000"}

                    </h5>

                </div>

            </div>



            <hr>



            <div class="row g-4">


                <div class="col-md-6">

                    <small class="text-muted">

                        PROFESSIONAL

                    </small>

                    <h6 class="mt-1">

                        ${booking.provider || "QuickFix Services"}

                    </h6>

                </div>



                <div class="col-md-6">

                    <small class="text-muted">

                        ESTIMATED PRICE

                    </small>

                    <h6 class="mt-1 orange">

                        ₹${booking.price || "299"}

                    </h6>

                </div>



                <div class="col-md-6">

                    <small class="text-muted">

                        SERVICE DATE

                    </small>

                    <h6 class="mt-1">

                        ${booking.date || "-"}

                    </h6>

                </div>



                <div class="col-md-6">

                    <small class="text-muted">

                        PREFERRED TIME

                    </small>

                    <h6 class="mt-1">

                        ${booking.time || "-"}

                    </h6>

                </div>



                <div class="col-12">

                    <small class="text-muted">

                        SERVICE ADDRESS

                    </small>

                    <h6 class="mt-1">

                        ${booking.address || "-"}

                    </h6>

                </div>



            </div>



            <div class="alert alert-success mt-4 mb-0">

                <strong>✓ Booking Confirmed</strong>

                <br>

                <small>

                    Your professional is scheduled for the selected
                    date and time.

                </small>

            </div>



            <div class="d-flex gap-2 flex-wrap mt-4">

                <a href="services.html"
                   class="btn btn-orange">

                    Book Another Service

                </a>


                <a href="confirmation.html"
                   class="btn btn-outline-dark">

                    View Confirmation

                </a>

            </div>

        </div>

    `;

}


else {


    container.innerHTML = `

        <div class="card border-0 shadow-sm p-5 text-center">

            <div style="font-size:50px;">

                📋

            </div>


            <h3 class="mt-3">

                No Bookings Yet

            </h3>


            <p class="text-muted">

                You haven't made a service booking yet.

            </p>


            <div>

                <a href="services.html"
                   class="btn btn-orange">

                    Explore Services

                </a>

            </div>

        </div>

    `;

}


</script>


</body>

</html>
